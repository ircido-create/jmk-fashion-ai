<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>JMK Fashion — Gestão</title>
    <meta name="description" content="Sistema de gestão JMK Fashion: clientes, estoque, vendas e atendimento WhatsApp." />
    <meta name="author" content="JMK Fashion" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#9333EA" />
    <link rel="icon" href="/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Conversas" />

    <!-- Sem canonical nem og:url absolutos: apontavam para o domínio do Lovable e
         ficariam errados após a migração. Sistema interno atrás de login, então
         compartilhamento e indexação não têm papel aqui; o caminho relativo da
         imagem basta. Se um domínio próprio for configurado, dá para voltar com
         as URLs absolutas apontando para ele. -->
    <meta property="og:title" content="JMK Fashion — Gestão de Moda" />
    <meta property="og:description" content="Sistema de gestão JMK Fashion: clientes, estoque, vendas e atendimento WhatsApp." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/icon-512.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/icon-512.png" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
