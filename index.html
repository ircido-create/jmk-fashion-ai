<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

    <!-- A raiz do domínio é a loja virtual, então o título e a descrição que o
         WhatsApp e o Google leem são os da loja. O administrativo troca o
         título ao abrir (AppLayout) e se marca como noindex, e fica atrás de
         login de qualquer forma.

         O que está aqui é o que os robôs que NÃO executam JavaScript leem —
         WhatsApp, Facebook e Instagram entram nessa lista. O Google executa,
         então as páginas internas ajustam título, descrição e canonical pelo
         componente <Seo>. As peças ganham a marcação certa no build
         (vite-plugin-seo.ts), que escreve um HTML próprio para cada uma. -->
    <title>JMK Modas — Moda feminina em Osasco com provador de IA</title>
    <meta name="description" content="Loja de moda feminina em Osasco: vestidos, saias, blusas e conjuntos, quase tudo peça única. Prove a roupa em você pelo provador de inteligência artificial e retire na Rua Manoel Cardoso, 20." />
    <meta name="author" content="JMK Modas" />
    <link rel="canonical" href="https://www.jmkmodas.com.br/" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />

    <!-- Busca local: é uma loja de rua, e a maior parte das clientes procura
         "loja de roupa feminina em Osasco", não a marca. -->
    <meta name="geo.region" content="BR-SP" />
    <meta name="geo.placename" content="Osasco" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#9333EA" />
    <link rel="icon" href="/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Conversas" />

    <!-- Prévia no WhatsApp e nas redes. As URLs são absolutas de propósito: o
         WhatsApp não resolve caminho relativo e mostrava o link sem imagem.
         O domínio com www é o que responde 200 — a raiz sem www redireciona. -->
    <meta property="og:site_name" content="JMK Modas" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.jmkmodas.com.br/" />
    <meta property="og:title" content="JMK Modas — Moda feminina em Osasco com provador de IA" />
    <meta property="og:description" content="Vestidos, saias, blusas e conjuntos, quase tudo peça única. Prove a roupa em você antes de ir à loja." />
    <meta property="og:image" content="https://www.jmkmodas.com.br/og-jmk-modas.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="JMK Modas — moda feminina em Osasco" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="JMK Modas — Moda feminina em Osasco com provador de IA" />
    <meta name="twitter:description" content="Vestidos, saias, blusas e conjuntos, quase tudo peça única. Prove a roupa em você antes de ir à loja." />
    <meta name="twitter:image" content="https://www.jmkmodas.com.br/og-jmk-modas.jpg" />

    <!-- Loja física: é isto que o Google usa para mostrar a JMK em "loja de
         roupa feminina perto de mim" e no mapa. O endereço e o telefone vêm do
         banco no build (store_settings_publicas), e o plugin reescreve este
         bloco se eles mudarem. -->
    <script type="application/ld+json" data-jmk="local">
    {
      "@context": "https://schema.org",
      "@type": "ClothingStore",
      "@id": "https://www.jmkmodas.com.br/#loja",
      "name": "JMK Modas",
      "description": "Loja de moda feminina em Osasco: vestidos, saias, blusas e conjuntos.",
      "url": "https://www.jmkmodas.com.br/",
      "image": "https://www.jmkmodas.com.br/og-jmk-modas.jpg",
      "telephone": "+5511967842865",
      "priceRange": "R$",
      "currenciesAccepted": "BRL",
      "paymentAccepted": "Pix, Cartão de crédito, Dinheiro",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "Rua Manoel Cardoso, 20",
        "addressLocality": "Osasco",
        "addressRegion": "SP",
        "addressCountry": "BR"
      },
      "areaServed": { "@type": "City", "name": "Osasco" }
    }
    </script>

    <script type="application/ld+json" data-jmk="site">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "@id": "https://www.jmkmodas.com.br/#site",
      "name": "JMK Modas",
      "url": "https://www.jmkmodas.com.br/",
      "inLanguage": "pt-BR",
      "publisher": { "@id": "https://www.jmkmodas.com.br/#loja" }
    }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
